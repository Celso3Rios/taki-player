<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:app="http://schemas.android.com/apk/res-auto"
    android:id="@+id/contentRoot"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:fitsSystemWindows="true"
    android:orientation="vertical"
    android:background="@color/bg">

    <LinearLayout
        android:id="@+id/topPanel"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="vertical"
        android:paddingStart="12dp"
        android:paddingEnd="12dp"
        android:paddingTop="10dp">
        <LinearLayout
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:gravity="center_vertical"
            android:orientation="horizontal">
            <TextView
                android:layout_width="0dp"
                android:layout_height="wrap_content"
                android:layout_weight="1"
                android:text="▶ TAKI PLAYER"
                android:textColor="@color/primary"
                android:textSize="22sp"
                android:fontFamily="sans-serif-black" />
            <Button
                android:id="@+id/btnImport"
                android:layout_width="wrap_content"
                android:layout_height="44dp"
                android:text="@string/importar"
                android:textAllCaps="false"
                android:textStyle="bold"
                android:textSize="11sp"
                android:textColor="@color/white"
                android:background="@drawable/bg_primary"
                android:paddingStart="12dp"
                android:paddingEnd="12dp" />
        </LinearLayout>
        <TextView
            android:id="@+id/txtSummary"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:paddingBottom="6dp"
            android:paddingTop="4dp"
            android:ellipsize="end"
            android:singleLine="true"
            android:text="Sua biblioteca · nenhuma lista importada"
            android:textColor="@color/muted"
            android:textSize="12sp" />
    </LinearLayout>

    <FrameLayout
        android:id="@+id/videoFrame"
        android:layout_width="match_parent"
        android:layout_height="210dp"
        android:layout_marginStart="12dp"
        android:layout_marginEnd="12dp"
        android:layout_marginTop="4dp"
        android:layout_marginBottom="4dp"
        android:background="@color/bg">
        <androidx.media3.ui.PlayerView
            android:id="@+id/playerView"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#000000"
            app:use_controller="true"
            app:show_buffering="when_playing"
            app:resize_mode="fit" />
        <TextView
            android:id="@+id/txtPlayerOverlay"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:gravity="center"
            android:padding="24dp"
            android:text="▶\n\nSelecione um canal, filme ou episódio"
            android:textColor="@color/muted"
            android:textAlignment="center"
            android:textSize="15sp"
            android:background="#E6081727" />
    </FrameLayout>

    <LinearLayout
        android:id="@+id/playerBar"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:layout_marginStart="12dp"
        android:layout_marginEnd="12dp"
        android:orientation="horizontal"
        android:gravity="center_vertical">
        <LinearLayout
            android:layout_width="0dp"
            android:layout_height="wrap_content"
            android:layout_weight="1"
            android:orientation="vertical">
            <TextView
                android:id="@+id/txtNowPlaying"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:ellipsize="end"
                android:singleLine="true"
                android:text="Nenhuma mídia selecionada"
                android:textColor="@color/white"
                android:textStyle="bold"
                android:textSize="13sp" />
            <TextView
                android:id="@+id/txtPlayerState"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:ellipsize="end"
                android:singleLine="true"
                android:text="Player nativo Media3 / ExoPlayer"
                android:textColor="@color/muted"
                android:textSize="11sp" />
        </LinearLayout>
        <Button
            android:id="@+id/btnExternal"
            android:layout_width="wrap_content"
            android:layout_height="40dp"
            android:layout_marginStart="4dp"
            android:text="VLC"
            android:textAllCaps="false"
            android:textColor="@color/primary"
            android:textSize="11sp"
            android:background="@drawable/bg_input"
            android:paddingStart="12dp"
            android:paddingEnd="12dp" />
        <Button
            android:id="@+id/btnFullscreen"
            android:layout_width="wrap_content"
            android:layout_height="40dp"
            android:layout_marginStart="6dp"
            android:text="⛶"
            android:contentDescription="@string/fullscreen"
            android:textColor="@color/white"
            android:textSize="20sp"
            android:background="@drawable/bg_input"
            android:paddingStart="11dp"
            android:paddingEnd="11dp" />
    </LinearLayout>

    <HorizontalScrollView
        android:id="@+id/tabsScroll"
        android:layout_width="match_parent"
        android:layout_height="55dp"
        android:fillViewport="true"
        android:scrollbars="none">
        <LinearLayout
            android:id="@+id/tabsContainer"
            android:layout_width="wrap_content"
            android:layout_height="match_parent"
            android:gravity="center_vertical"
            android:orientation="horizontal"
            android:paddingStart="9dp"
            android:paddingEnd="9dp" />
    </HorizontalScrollView>

    <LinearLayout
        android:id="@+id/filterPanel"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:paddingStart="12dp"
        android:paddingEnd="12dp"
        android:orientation="vertical">
        <LinearLayout
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:gravity="center_vertical">
            <EditText
                android:id="@+id/editSearch"
                android:layout_width="0dp"
                android:layout_height="44dp"
                android:layout_weight="1"
                android:background="@drawable/bg_input"
                android:hint="@string/search_hint"
                android:inputType="text"
                android:imeOptions="actionSearch"
                android:singleLine="true"
                android:paddingStart="12dp"
                android:paddingEnd="8dp"
                android:textColor="@color/white"
                android:textColorHint="@color/muted"
                android:textSize="13sp" />
            <Button
                android:id="@+id/btnFavorites"
                android:layout_width="48dp"
                android:layout_height="44dp"
                android:layout_marginStart="7dp"
                android:text="☆"
                android:contentDescription="Mostrar favoritos"
                android:textColor="@color/warning"
                android:textSize="23sp"
                android:background="@drawable/bg_input" />
        </LinearLayout>
        <Spinner
            android:id="@+id/spinnerCategory"
            android:layout_width="match_parent"
            android:layout_height="43dp"
            android:layout_marginTop="7dp"
            android:background="@drawable/bg_input" />
        <TextView
            android:id="@+id/txtListStatus"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:minHeight="24dp"
            android:gravity="center_vertical"
            android:text="Importe sua lista para ver os conteúdos."
            android:textColor="@color/muted"
            android:textSize="12sp" />
    </LinearLayout>

    <androidx.recyclerview.widget.RecyclerView
        android:id="@+id/recyclerItems"
        android:layout_width="match_parent"
        android:layout_height="0dp"
        android:layout_weight="1"
        android:paddingStart="7dp"
        android:paddingEnd="7dp"
        android:clipToPadding="false"
        android:scrollbars="vertical" />

    <ProgressBar
        android:id="@+id/progress"
        style="?android:attr/progressBarStyleHorizontal"
        android:layout_width="match_parent"
        android:layout_height="3dp"
        android:visibility="gone"
        android:indeterminate="true"
        android:progressTint="@color/primary" />
</LinearLayout>
