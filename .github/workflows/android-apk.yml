
name: Compilar Taki Player APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Gerar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Instalar Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificar estrutura do projeto
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Estrutura do Taki Player encontrada."

      - name: Testar leitor de listas M3U
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compilar APK instalavel
        run: gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Taki-Player-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
