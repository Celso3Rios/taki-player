
name: Compilar Taki Player APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    name: Gerar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Executar testes de parser
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compilar APK instalável
        run: gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Taki-Player-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
